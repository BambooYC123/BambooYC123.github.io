---
permalink: /EricBlog/
sitemap: false
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eric's Blog has moved</title>
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}">
    <script>
      window.location.replace(
        {{ '/' | relative_url | jsonify }} +
        window.location.search +
        window.location.hash
      );
    </script>
  </head>
  <body>
    <p>
      Eric's Blog has moved to
      <a href="{{ '/' | relative_url }}">{{ site.url }}{{ site.baseurl }}/</a>.
    </p>
  </body>
</html>
